services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vyaparmitra
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - ALLOWED_ORIGINS=*
    volumes:
      - vyaparmitra_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vyaparmitra_data:
